<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>轉到新網址…｜番社參拾</title>
<script>
/* 有人用舊網站格式的網址（例如 /2026/09/04/文章代稱/）連進來時，轉到新網站對應的頁面 */
(function () {
  var path = location.pathname;
  var base = '/';
  // 放在 帳號.github.io/專案名稱/ 底下時，網站根目錄是 /專案名稱/
  if (/\.github\.io$/i.test(location.hostname)) {
    var first = path.split('/')[1];
    if (first && !/\.github\.io$/i.test(first) && !/^(\d{4}|category|tag|page)$/.test(decodeURIComponent(first))) base = '/' + first + '/';
  }
  var rest = path.slice(base.length);
  var seg = rest.split('/').filter(Boolean).map(function (s) { try { return decodeURIComponent(s); } catch (e) { return s; } });
  var q = '';
  if (!seg.length) q = '';
  else if (seg[0] === 'category') q = '?category_name=' + encodeURIComponent(seg[seg.length - 1]);
  else if (seg[0] === 'tag') q = '?tag=' + encodeURIComponent(seg[1] || '');
  else if (/^\d{4}$/.test(seg[0])) q = seg.length >= 4 ? '?name=' + encodeURIComponent(seg[3]) : '?view=archives';
  else if (seg[0] === 'page' && /^\d+$/.test(seg[1] || '')) q = '?paged=' + seg[1];
  else q = '?pagename=' + encodeURIComponent(seg[seg.length - 1]);
  location.replace(base + q + location.hash);
})();
</script>
</head>
<body>
<p>正在轉到新網址。沒有自動轉過去的話，請回到 <a href="/">首頁</a>。</p>
</body>
</html>
